[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "betrugserkennung"
version = "0.1.0"
description = "Scam-Erkennung fuer Kleinanzeigen mittels lokalem LLM"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "LifeguardORG" },
]
dependencies = [
    "ollama",
    "pyyaml",
    "click",
    "pydantic",
    "rich",
    "PyQt6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]
training = [
    "scikit-learn",
    "pandas",
]
scraper = [
    "requests",
    "beautifulsoup4",
]

[project.scripts]
betrugserkennung = "betrugserkennung.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/betrugserkennung"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
